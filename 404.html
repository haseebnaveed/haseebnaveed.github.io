<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found · Haseeb Naveed</title>
<meta name="description" content="Page not found.">
<meta name="theme-color" content="#F5EFE4">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
<style>
@font-face{font-family:'Fraunces';src:url('fonts/fraunces-normal.woff2') format('woff2');font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:'Fraunces';src:url('fonts/fraunces-italic.woff2') format('woff2');font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:'Inter';src:url('fonts/inter.woff2') format('woff2');font-weight:300;font-style:normal;font-display:swap}
@font-face{font-family:'Inter';src:url('fonts/inter.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#F5EFE4;--text:#201B15;--muted:#4A3C2E;
  --accent:#B8782A;--accent2:#A87038;--border2:#C8B89A;
}
:root.dark{
  --bg:#1E1A14;--text:#E8DECE;--muted:#9A8E7E;
  --accent:#C9924A;--accent2:#A87038;--border2:#3A3025;
}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;transition:background 0.4s ease,color 0.4s ease}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.tag{font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:var(--accent);margin-bottom:1.5rem}
h1{font-family:'Fraunces',serif;font-style:italic;font-weight:400;font-size:clamp(2rem,6vw,3rem);margin-bottom:1rem}
p{color:var(--muted);max-width:420px;margin-bottom:2rem;font-weight:300;line-height:1.7}
.btn{display:inline-flex;align-items:center;gap:0.5rem;padding:0.65rem 1.5rem;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;border-radius:2rem;font-weight:500;background:var(--accent);color:var(--bg);border:1px solid var(--accent);transition:background 0.4s ease,border-color 0.4s ease}
.btn:hover{background:var(--accent2);border-color:var(--accent2)}
</style>
</head>
<body>
<div class="tag">404</div>
<h1>This page went missing.</h1>
<p>The page you're looking for doesn't exist, or has moved. Let's get you back to the portfolio.</p>
<a href="/index.html" class="btn">Back to portfolio</a>
<script>
if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
</script>
</body>
</html>
